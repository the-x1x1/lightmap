name: Desktop

# LightMap for Windows and Mac (apps/desktop). Every push to main builds both apps, smoke-tests
# the built app and the installed one, and keeps the downloads as workflow artifacts. A v* tag
# does the same and then publishes the GitHub release with LightMap-Setup-<version>.exe, the Mac
# disk image and update zip, and a .sha256 for each: that release is what installed copies find
# and install by themselves. It becomes "latest" only once both platforms' files are on it.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows app · build · smoke · publish
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Version
        id: version
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and "v$v" -ne $env:GITHUB_REF_NAME) {
            throw "tag $env:GITHUB_REF_NAME does not match package.json version $v"
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "LightMap $v"

      # Hoisted node_modules: the installer carries real files, not pnpm's links.
      - name: Install
        run: pnpm install --frozen-lockfile --config.node-linker=hoisted

      - name: Build the web app (standalone server)
        run: pnpm --filter @lightmap/web build
        env:
          LIGHTMAP_DESKTOP: '1'
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Publish the desktop shell
        run: >-
          dotnet publish apps/desktop/LightMap.Desktop/LightMap.Desktop.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:DebugType=none
          -p:Version=${{ steps.version.outputs.version }}
          -o apps/desktop/publish

      - name: Stage the app
        shell: pwsh
        run: |
          $node = (Get-Command node).Source
          node apps/desktop/scripts/stage.mjs --node $node --shell apps/desktop/publish
          if ($LASTEXITCODE -ne 0) { throw "staging failed" }

      - name: Smoke-test the staged app
        shell: pwsh
        run: |
          $p = Start-Process -FilePath apps/desktop/stage/LightMap.exe -ArgumentList '--selftest' -Wait -PassThru
          Get-Content "$env:LOCALAPPDATA\LightMap\logs\selftest.log" | ForEach-Object { if ($_ -match ' (FAIL|server!) ') { "::error::$_" } else { $_ } }
          if ($p.ExitCode -ne 0) { throw "selftest failed with $($p.ExitCode)" }

      - name: Build the installer
        id: installer
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.version }}'
          $candidates = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe")
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            Write-Host 'Inno Setup is not on this runner; installing it'
            choco install innosetup --no-progress --yes
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw 'Inno Setup 6 could not be found or installed' }
          & $iscc "/DAppVersion=$v" '/DPayloadDir=..\stage' apps\desktop\installer\lightmap-setup.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC exited with $LASTEXITCODE" }
          $exe = "apps/desktop/installer/Output/LightMap-Setup-$v.exe"
          $hash = (Get-FileHash -Algorithm SHA256 -Path $exe).Hash.ToLower()
          "$hash  LightMap-Setup-$v.exe" | Set-Content -NoNewline -Encoding ascii "$exe.sha256"
          Get-Content "$exe.sha256"
          "exe=$exe" >> $env:GITHUB_OUTPUT

      - name: Install silently and smoke-test the installed copy
        shell: pwsh
        run: |
          $exe = '${{ steps.installer.outputs.exe }}'
          $log = Join-Path $env:RUNNER_TEMP 'setup.log'
          $p = Start-Process -FilePath $exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/NOCANCEL', '/nolaunch=1', "/LOG=$log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content $log; throw "setup exited with $($p.ExitCode)" }
          $app = Join-Path $env:LOCALAPPDATA 'Programs\LightMap'
          if (-not (Test-Path (Join-Path $app '.lightmap-installed'))) { throw 'the installed-copy marker is missing' }
          if (-not (Test-Path (Join-Path $app 'runtime\node.exe'))) { throw 'the runtime is missing' }
          $p = Start-Process -FilePath (Join-Path $app 'LightMap.exe') -ArgumentList '--selftest' -Wait -PassThru
          Get-Content "$env:LOCALAPPDATA\LightMap\logs\selftest.log" | ForEach-Object { if ($_ -match ' (FAIL|server!) ') { "::error::$_" } else { $_ } }
          if ($p.ExitCode -ne 0) { throw "installed selftest failed with $($p.ExitCode)" }

      - uses: actions/upload-artifact@v4
        with:
          name: LightMap-Setup-${{ steps.version.outputs.version }}
          path: |
            ${{ steps.installer.outputs.exe }}
            ${{ steps.installer.outputs.exe }}.sha256
          retention-days: 14

  mac:
    name: Mac app · build · smoke · update
    runs-on: macos-latest # Apple Silicon
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Version
        id: version
        run: |
          v=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $v"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      # Hoisted node_modules: the bundle carries real files, not pnpm's links. Native packages
      # (sharp) come in for macOS on Apple Silicon because they are installed here.
      - name: Install
        run: pnpm install --frozen-lockfile --config.node-linker=hoisted

      - name: Build the web app (standalone server)
        run: pnpm --filter @lightmap/web build
        env:
          LIGHTMAP_DESKTOP: '1'
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Build LightMap.app, the update zip and the disk image
        run: bash apps/desktop/mac/build-app.sh "${{ steps.version.outputs.version }}"

      - name: Smoke-test the built app
        run: |
          set -o pipefail
          apps/desktop/mac/out/LightMap.app/Contents/MacOS/LightMap --selftest \
            | sed -E 's/^(.* (FAIL|server!) .*)$/::error::\1/'

      - name: Install from the disk image and smoke-test the installed copy
        run: |
          set -o pipefail
          v='${{ steps.version.outputs.version }}'
          mnt="$RUNNER_TEMP/lightmap-dmg"
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "apps/desktop/mac/out/LightMap-$v-mac-arm64.dmg"
          test -L "$mnt/Applications" || { echo "::error::the disk image has no Applications shortcut"; exit 1; }
          rm -rf /Applications/LightMap.app
          ditto "$mnt/LightMap.app" /Applications/LightMap.app
          hdiutil detach "$mnt"
          codesign --verify --verbose=2 /Applications/LightMap.app
          /Applications/LightMap.app/Contents/MacOS/LightMap --selftest \
            | sed -E 's/^(.* (FAIL|server!) .*)$/::error::\1/'

      # The real update path, end to end: a staged update to a higher version is found at launch,
      # handed to the swap script, the new bundle replaces the installed one, and it reopens.
      # Then a force-quit proves the server does not outlive the app.
      - name: Self-update and crash cleanup
        run: |
          v='${{ steps.version.outputs.version }}'
          next="$v.1"
          work="$RUNNER_TEMP/next"
          mkdir -p "$work"
          ditto /Applications/LightMap.app "$work/LightMap.app"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $next" -c "Set :CFBundleVersion $next" "$work/LightMap.app/Contents/Info.plist"
          codesign --force --sign - --timestamp=none "$work/LightMap.app"
          updates="$HOME/Library/Application Support/LightMap/updates"
          mkdir -p "$updates"
          ditto -c -k --keepParent "$work/LightMap.app" "$updates/LightMap-$next-mac-arm64.zip"
          printf '{"version":"%s","zip":"%s"}' "$next" "$updates/LightMap-$next-mac-arm64.zip" > "$updates/staged.json"
          open /Applications/LightMap.app
          for i in $(seq 1 120); do
            got=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" /Applications/LightMap.app/Contents/Info.plist 2>/dev/null || true)
            [ "$got" = "$next" ] && break
            sleep 1
          done
          cat "$HOME/Library/Logs/LightMap/update.log" || true
          if [ "$got" != "$next" ]; then
            echo "::error::the staged update was not installed (version is $got, wanted $next)"
            cat "$HOME/Library/Logs/LightMap/desktop.log" || true
            exit 1
          fi
          test ! -e "$updates/staged.json" || { echo "::error::staged.json was left behind"; exit 1; }
          # The reopened app starts its server; wait for it, then force-quit the app.
          for i in $(seq 1 90); do
            curl -fs http://127.0.0.1:47615/api/health > /dev/null && break
            sleep 1
          done
          curl -fs http://127.0.0.1:47615/api/health || { echo "::error::the updated app's server did not answer"; cat "$HOME/Library/Logs/LightMap/desktop.log"; exit 1; }
          echo
          pkill -9 -x LightMap
          for i in $(seq 1 15); do
            pgrep -f 'LightMap.app/Contents/Resources/runtime/node' > /dev/null || break
            sleep 1
          done
          if pgrep -fl 'LightMap.app/Contents/Resources/runtime/node'; then
            echo "::error::the server outlived a force-quit app"; exit 1
          fi
          echo "updated to $next, reopened, and the server ended with the app"

      - uses: actions/upload-artifact@v4
        with:
          name: LightMap-mac-${{ steps.version.outputs.version }}
          path: |
            apps/desktop/mac/out/*.dmg
            apps/desktop/mac/out/*.dmg.sha256
            apps/desktop/mac/out/*.zip
            apps/desktop/mac/out/*.zip.sha256
          retention-days: 14

  # Both platforms' files go up first and the release becomes "latest" last, so an installed copy
  # never sees a latest release without its update.
  publish:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, mac]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          V="${TAG#v}"
          ls -la dist
          awk -v h="## v$V" 'index($0, h) == 1 { on = 1; next } on && /^## / { exit } on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then echo "LightMap $V" > "$RUNNER_TEMP/notes.md"; fi
          cat >> "$RUNNER_TEMP/notes.md" <<EOF

          **Windows:** download \`LightMap-Setup-$V.exe\` and run it.

          **Mac (Apple Silicon):** download \`LightMap-$V-mac-arm64.dmg\`, open it and drag LightMap into Applications. The first time, macOS says it cannot check LightMap: open **System Settings › Privacy & Security** and choose **Open Anyway** (LightMap is not yet signed with an Apple Developer ID).

          Installed copies on both update themselves.
          EOF
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --draft --verify-tag --title "LightMap $V" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          fi
          gh release upload "$TAG" dist/* --clobber
          gh release edit "$TAG" --draft=false --latest
