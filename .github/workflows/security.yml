name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'

jobs:
  audit:
    name: Dependency audit · secrets · licences
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # pnpm version comes from package.json "packageManager"; passing `version` too makes
      # pnpm/action-setup fail with "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: pnpm audit (high and above fail)
        run: pnpm audit --audit-level high
      - run: pnpm secrets:scan
      - run: pnpm licenses:check
  codeql:
    name: CodeQL
    # Code scanning on private repositories needs GitHub Advanced Security; run it once the
    # repository is public (or GHAS is enabled — then drop this condition).
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
