name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 10
  NODE_VERSION: 22

jobs:
  validate:
    name: Install · lint · typecheck · unit · build · licences
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm env:validate
        env:
          NODE_ENV: development
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit -- --coverage
      - run: node --experimental-strip-types scripts/check-attribution.ts
      - run: pnpm licenses:check
      - run: pnpm secrets:scan
      - name: Migration set is valid
        run: node --experimental-strip-types -e "import('./packages/database/src/migrate.ts').then(async (m) => { const p = m.validateMigrationSet(await m.loadMigrations()); if (p.length) { console.error(p); process.exit(1); } console.log('migrations ok'); })"
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_APP_URL: http://localhost:3000
      - name: Bundle size (first-load JS must stay reasonable)
        run: node --experimental-strip-types scripts/check-bundle.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage
          if-no-files-found: ignore

  integration:
    name: Integration · E2E (main only)
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: lightmap
          POSTGRES_PASSWORD: lightmap
          POSTGRES_DB: lightmap_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U lightmap" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://lightmap:lightmap@localhost:5432/lightmap_e2e
      AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      AUTH_URL: http://localhost:3100
      NEXT_PUBLIC_APP_URL: http://localhost:3100
      WEATHER_PROVIDER: fixture
      GEOCODER_PROVIDER: fixture
      AUTH_DEV_LOGIN: 'true'
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm --filter @lightmap/database test:integration
      - run: pnpm --filter @lightmap/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
