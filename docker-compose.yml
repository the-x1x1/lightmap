# Local PostgreSQL + PostGIS for development (plan §13). `pnpm db:up`, then `pnpm db:migrate`.
# Matches the default DATABASE_URL in .env.example: postgres://lightmap:lightmap@localhost:5432/lightmap
services:
  db:
    image: postgis/postgis:16-3.4
    container_name: lightmap-db
    environment:
      POSTGRES_USER: lightmap
      POSTGRES_PASSWORD: lightmap
      POSTGRES_DB: lightmap
    ports:
      - '5432:5432'
    volumes:
      - lightmap-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lightmap -d lightmap']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  lightmap-pgdata:
