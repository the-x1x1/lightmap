<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>LightMap renderer smoke</title>
    <!-- Runs the real renderer (packages/renderer) against a bundled Cesium build in a headless browser. See ../README.md. -->
    <link rel="stylesheet" href="/cesium-build/Widgets/widgets.css" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
      }
      #map {
        width: 960px;
        height: 600px;
      }
      #credits {
        position: fixed;
        bottom: 0;
        right: 0;
        color: #fff;
        font: 10px sans-serif;
      }
    </style>
    <script>
      window.CESIUM_BASE_URL = '/cesium-build/';
    </script>
    <script type="importmap">
      {
        "imports": {
          "@cesium/engine": "/cesium-build/index.js",
          "@lightmap/config": "/dist/config/src/index.js",
          "@lightmap/geospatial": "/dist/geospatial/src/index.js",
          "@lightmap/astronomy": "/dist/astronomy/src/index.js",
          "@lightmap/weather": "/dist/weather/src/index.js",
          "@lightmap/scene": "/dist/scene/src/index.js",
          "@lightmap/renderer": "/dist/renderer/src/index.js",
          "@lightmap/renderer/cesium": "/dist/renderer/src/cesium/index.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="map"></div>
    <div id="credits"></div>
    <script type="module">
      window.__smoke = { errors: [], steps: [], done: false };
      const selfDriven = new URLSearchParams(location.search).get('drive') === 'self';
      if (selfDriven) {
        // What a runner would have read from the browser: the console's complaints.
        window.__smoke.shots = [];
        window.__smoke.console = [];
        for (const level of ['error', 'warn']) {
          const real = console[level].bind(console);
          console[level] = (...args) => {
            if (window.__smoke.console.length < 200)
              window.__smoke.console.push(level + ': ' + args.map(String).join(' ').slice(0, 400));
            real(...args);
          };
        }
      }
      const log = (s) => {
        window.__smoke.steps.push(s);
        console.log('[smoke]', s);
      };
      window.addEventListener('error', (e) =>
        window.__smoke.errors.push('window: ' + (e.message || e)),
      );
      window.addEventListener('unhandledrejection', (e) =>
        window.__smoke.errors.push('rejection: ' + ((e.reason && e.reason.message) || e.reason)),
      );
      try {
        const { localSelectionToUtc } = await import('@lightmap/astronomy');
        const { buildSceneState, DEFAULT_RENDER_SETTINGS, defaultCamera } =
          await import('@lightmap/scene');
        const { OPEN_METEO_CAPABILITIES } = await import('@lightmap/weather');
        const { SceneController, lightingFromScene } = await import('@lightmap/renderer');
        const { createCesiumHost } = await import('@lightmap/renderer/cesium');
        log('modules loaded');
        const kailua = {
          point: { latitude: 21.397, longitude: -157.727 },
          timeZone: 'Pacific/Honolulu',
          label: 'Kailua Beach',
          source: 'search',
        };
        const env = {
          terrainAvailable: false,
          terrainProviderId: 'ellipsoid',
          basemapProviderId: 'natural-earth-ii',
          basemapDetail: 'coarse',
          buildingsAvailable: false,
          groundElevationM: 2,
          attributions: [],
          fixtureMode: true,
        };
        const scene = (hour, scenario, camera) =>
          buildSceneState({
            location: kailua,
            utc: localSelectionToUtc({ year: 2026, month: 5, day: 31 }, hour * 60, kailua.timeZone),
            now: new Date('2026-05-01T00:00:00Z'),
            camera: camera ?? defaultCamera(kailua.point, 90),
            environment: env,
            scenario,
            forceScenario: true,
            weather: { capabilities: OPEN_METEO_CAPABILITIES, frames: [], providerFailed: false },
            render: DEFAULT_RENDER_SETTINGS,
            includeLunar: true,
            realReference: false,
          });
        const host = await createCesiumHost({
          container: document.getElementById('map'),
          creditContainer: document.getElementById('credits'),
          requestRenderMode: false,
          msaaSamples: 1,
          onError: (m, e) =>
            window.__smoke.errors.push('host: ' + m + ' ' + ((e && e.message) || e)),
        });
        log('host created');
        // Self-driven (?drive=self): the page saves its own shots and result to the server it
        // came from, so a run needs no Playwright - any browser will do, on a real GPU. The
        // local runner (tools/local-runner) serves the page and keeps what it posts.
        if (selfDriven) {
          const gl = host.scene.context._gl;
          const info = gl.getExtension('WEBGL_debug_renderer_info');
          window.__smoke.gpu = String(
            gl.getParameter(info ? info.UNMASKED_RENDERER_WEBGL : gl.RENDERER),
          );
          const post = (to, body, type) =>
            fetch(to, { method: 'POST', headers: { 'Content-Type': type }, body }).catch(
              () => undefined,
            );
          const snap = () => {
            // As the host's own capture: a frame at the planned time, read back at once.
            host.scene.requestRender();
            host.scene.render(host.widget.clock.currentTime);
            const src = host.scene.canvas;
            const copy = document.createElement('canvas');
            copy.width = src.width;
            copy.height = src.height;
            copy.getContext('2d').drawImage(src, 0, 0);
            return new Promise((resolve) => copy.toBlob(resolve, 'image/png'));
          };
          const started = performance.now();
          const drive = async () => {
            const name = window.__smoke.shot;
            if (name) {
              const png = await snap().catch(() => null);
              if (png) await post('/__shot/' + name, png, 'image/png');
              window.__smoke.shots.push(name);
              window.__smoke.shot = null;
              if (window.__takeShot) window.__takeShot();
            }
            if (window.__smoke.done) {
              window.__smoke.seconds = Math.round((performance.now() - started) / 1000);
              await post('/__result/result', JSON.stringify(window.__smoke), 'application/json');
              document.title = 'LightMap renderer smoke - done';
              return;
            }
            setTimeout(drive, 150);
          };
          drive();
        }
        const controller = new SceneController(host, { aspect: () => 960 / 600 });
        await controller.setProviders(
          { kind: 'ellipsoid', attribution: '' },
          { kind: 'cesium-natural-earth', attribution: 'NE' },
        );
        log('providers set');
        const s1 = scene(12.5, 'clear');
        controller.apply(s1);
        window.__smoke.lighting = { clear: lightingFromScene(s1) };
        log('applied noon clear');
        const wait = (ms) => new Promise((r) => setTimeout(r, ms));
        const frames = (n) =>
          new Promise((resolve) => {
            let k = 0;
            const h = () => {
              if (++k >= n) {
                host_scene_postRender_remove();
                resolve();
              }
            };
            const host_scene_postRender_remove = host.scene.postRender.addEventListener(h);
          });
        // SMOKE_ONLY=synthetic: straight to the synthetic terrain stage (minutes, not half an hour).
        const Cesium = await import('@cesium/engine');
        if (!window.__synthOnly) {
          window.__smoke.phase = 'noon-clear';
          await wait(6000);
          const stats1 = host.stats();
          window.__smoke.stats1 = stats1;
          window.__smoke.cesiumSun = stats1.cesiumSunDirectionEcef;
          window.__smoke.ourSun = lightingFromScene(s1).sunDirectionEcef;
          window.__smoke.shot = 'noon-clear';
          await wait(200);
          await new Promise((r) => {
            window.__takeShot = r;
          });
          const s2 = scene(12.5, 'overcast');
          controller.apply(s2);
          window.__smoke.lighting.overcast = lightingFromScene(s2);
          log('applied noon overcast');
          await wait(1500);
          window.__smoke.shot = 'noon-overcast';
          await new Promise((r) => {
            window.__takeShot = r;
          });
          const golden = scene(18.75, 'clear', {
            ...defaultCamera(kailua.point, 250),
            mode: 'viewpoint',
            pitchDeg: 5,
          });
          controller.apply(golden);
          window.__smoke.lighting.golden = lightingFromScene(golden);
          log('applied golden viewpoint');
          await wait(2500);
          window.__smoke.shot = 'golden-viewpoint';
          await new Promise((r) => {
            window.__takeShot = r;
          });
          // The cloud decks hold still in the sky as the camera turns: the same broken sky, the
          // camera turned 20 deg right between the two shots (the clouds should move left by as
          // much, not stay where they were on the screen).
          for (const [name, heading] of [
            ['deck-pan-a', 20],
            ['deck-pan-b', 40],
          ]) {
            controller.apply(
              scene(14, 'partly-cloudy', {
                ...defaultCamera(kailua.point, heading),
                mode: 'viewpoint',
                pitchDeg: 25,
              }),
            );
            await wait(2000);
            window.__smoke.shot = name;
            await new Promise((r) => {
              window.__takeShot = r;
            });
          }
          // A rainbow: a shower opposite the late-afternoon Sun (about 20 deg up in the west),
          // looking east and up, the rainbow uniform turned on as a forecast shower would.
          const bowScene = scene(17.5, 'partly-cloudy', {
            ...defaultCamera(kailua.point, 95),
            mode: 'viewpoint',
            pitchDeg: 12,
          });
          controller.apply(bowScene);
          for (const tgt of [host.gradeUniforms, host.gradeTarget]) {
            tgt['u_rainbow'] = 1;
            tgt['u_precipitation'] = 0.15;
          }
          host.scene.requestRender();
          await wait(2500);
          window.__smoke.shot = 'rainbow';
          await new Promise((r) => {
            window.__takeShot = r;
          });
          const blue = scene(19.5, 'clear', {
            ...defaultCamera(kailua.point, 250),
            mode: 'viewpoint',
            pitchDeg: 5,
          });
          controller.apply(blue);
          log('applied blue hour viewpoint');
          await wait(1500);
          window.__smoke.shot = 'blue-viewpoint';
          await new Promise((r) => {
            window.__takeShot = r;
          });
          const partly = scene(15, 'partly-cloudy', {
            ...defaultCamera(kailua.point, 250),
            mode: 'viewpoint',
            pitchDeg: 12,
          });
          controller.apply(partly);
          log('applied partly viewpoint');
          await wait(1500);
          window.__smoke.shot = 'partly-viewpoint';
          await new Promise((r) => {
            window.__takeShot = r;
          });
          // Broken cloud toward a Sun 20 deg up: dark cores, bright margins round the Sun.
          controller.apply(
            scene(17.5, 'partly-cloudy', {
              ...defaultCamera(kailua.point, 292),
              mode: 'viewpoint',
              pitchDeg: 14,
            }),
          );
          await wait(1500);
          window.__smoke.shot = 'partly-sunward';
          await new Promise((r) => {
            window.__takeShot = r;
          });
          // The same broken cloud from a forecast whose dew point puts its base at 600 m (26 deg C
          // over a 21.2 deg C dew point) rather than the default 1.5 km: lower, larger cloud.
          {
            const utc = localSelectionToUtc(
              { year: 2026, month: 5, day: 31 },
              17.5 * 60,
              kailua.timeZone,
            );
            const frame = (offsetH) => ({
              timestamp: new Date(utc.getTime() + offsetH * 3_600_000).toISOString(),
              cloudCoverTotal: 45,
              cloudCoverLow: 45,
              cloudCoverMid: 0,
              cloudCoverHigh: 0,
              precipitationProbability: 0,
              precipitationAmount: 0,
              humidity: 75,
              visibility: 30000,
              windSpeed: 6,
              windDirection: 60,
              weatherCode: 2,
              temperature: 26,
              dewPoint: 21.2,
            });
            controller.apply(
              buildSceneState({
                location: kailua,
                utc,
                now: new Date(utc.getTime() - 2 * 3_600_000),
                camera: { ...defaultCamera(kailua.point, 292), mode: 'viewpoint', pitchDeg: 14 },
                environment: env,
                scenario: 'partly-cloudy',
                forceScenario: false,
                weather: {
                  capabilities: OPEN_METEO_CAPABILITIES,
                  frames: [frame(-1), frame(0), frame(1)],
                  providerFailed: false,
                },
                render: DEFAULT_RENDER_SETTINGS,
                includeLunar: true,
                realReference: false,
              }),
            );
            await wait(1500);
            window.__smoke.shot = 'partly-low-base';
            await new Promise((r) => {
              window.__takeShot = r;
            });
          }
          // Snow falling: a forecast frame whose weather code says moderate snow, at -2 deg C under
          // a closed deck - flakes in the air, not rain's streaks.
          {
            const utc = localSelectionToUtc(
              { year: 2026, month: 5, day: 31 },
              14 * 60,
              kailua.timeZone,
            );
            const frame = (offsetH) => ({
              timestamp: new Date(utc.getTime() + offsetH * 3_600_000).toISOString(),
              cloudCoverTotal: 100,
              cloudCoverLow: 100,
              cloudCoverMid: 80,
              cloudCoverHigh: 0,
              precipitationProbability: 90,
              precipitationAmount: 1.5,
              humidity: 92,
              visibility: 4000,
              windSpeed: 3,
              windDirection: 60,
              weatherCode: 73,
              temperature: -2,
              dewPoint: -3,
            });
            controller.apply(
              buildSceneState({
                location: kailua,
                utc,
                now: new Date(utc.getTime() - 2 * 3_600_000),
                camera: { ...defaultCamera(kailua.point, 292), mode: 'viewpoint', pitchDeg: 4 },
                environment: env,
                scenario: 'overcast',
                forceScenario: false,
                weather: {
                  capabilities: OPEN_METEO_CAPABILITIES,
                  frames: [frame(-1), frame(0), frame(1)],
                  providerFailed: false,
                },
                render: DEFAULT_RENDER_SETTINGS,
                includeLunar: true,
                realReference: false,
              }),
            );
            await wait(1500);
            window.__smoke.shot = 'snowfall';
            await new Promise((r) => {
              window.__takeShot = r;
            });
          }
          // Altocumulus: a forecast with broken mid cloud alone (45 %) - a field of cloudlets
          // in ranks, blue between them - in the afternoon looking up at it, and at a low Sun
          // looking toward it, the cloudlets lit warm from under.
          for (const [name, hour, heading, pitch] of [
            ['altocumulus', 14, 200, 38],
            ['altocumulus-sunset', 18.75, 292, 16],
          ]) {
            const utc = localSelectionToUtc(
              { year: 2026, month: 5, day: 31 },
              hour * 60,
              kailua.timeZone,
            );
            const frame = (offsetH) => ({
              timestamp: new Date(utc.getTime() + offsetH * 3_600_000).toISOString(),
              cloudCoverTotal: 45,
              cloudCoverLow: 0,
              cloudCoverMid: 45,
              cloudCoverHigh: 0,
              precipitationProbability: 0,
              precipitationAmount: 0,
              humidity: 55,
              visibility: 30000,
              windSpeed: 4,
              windDirection: 60,
              weatherCode: 2,
              temperature: 24,
              dewPoint: 14,
            });
            controller.apply(
              buildSceneState({
                location: kailua,
                utc,
                now: new Date(utc.getTime() - 2 * 3_600_000),
                camera: {
                  ...defaultCamera(kailua.point, heading),
                  mode: 'viewpoint',
                  pitchDeg: pitch,
                },
                environment: env,
                scenario: 'partly-cloudy',
                forceScenario: false,
                weather: {
                  capabilities: OPEN_METEO_CAPABILITIES,
                  frames: [frame(-1), frame(0), frame(1)],
                  providerFailed: false,
                },
                render: DEFAULT_RENDER_SETTINGS,
                includeLunar: true,
                realReference: false,
              }),
            );
            await wait(1500);
            window.__smoke.shot = name;
            await new Promise((r) => {
              window.__takeShot = r;
            });
          }
          const night = scene(23, 'clear', {
            ...defaultCamera(kailua.point, 120),
            mode: 'viewpoint',
            pitchDeg: 30,
          });
          controller.apply(night);
          log('applied night viewpoint');
          await wait(1500);
          window.__smoke.shot = 'night-viewpoint';
          await new Promise((r) => {
            window.__takeShot = r;
          });
          const storm = scene(12.5, 'storm', {
            ...defaultCamera(kailua.point, 250),
            mode: 'viewpoint',
            pitchDeg: 5,
          });
          controller.apply(storm);
          log('applied storm viewpoint');
          await wait(1500);
          window.__smoke.shot = 'storm-viewpoint';
          await new Promise((r) => {
            window.__takeShot = r;
          });
          // Phase 4 experiment (feature flag `physicalSkyDome`): the same storm with the dome's
          // aerosol density from the sky model's Mie coefficient. Compare with the shot above —
          // a hazier, paler sky with a wider halo is the expected difference; nothing else moves.
          const stormPhysical = buildSceneState({
            location: kailua,
            utc: storm.utc,
            now: new Date('2026-05-01T00:00:00Z'),
            camera: storm.camera,
            environment: env,
            scenario: 'storm',
            forceScenario: true,
            weather: { capabilities: OPEN_METEO_CAPABILITIES, frames: [], providerFailed: false },
            render: { ...DEFAULT_RENDER_SETTINGS, physicalSkyDome: true },
            includeLunar: true,
            realReference: false,
          });
          controller.apply(stormPhysical);
          window.__smoke.lighting.stormPhysical = lightingFromScene(stormPhysical);
          log(
            'applied storm viewpoint, physical dome (mie ' +
              window.__smoke.lighting.stormPhysical.atmosphere.mieCoefficient +
              ')',
          );
          await wait(1500);
          window.__smoke.shot = 'storm-physical-dome';
          await new Promise((r) => {
            window.__takeShot = r;
          });
          // Back to the default dome for every scene that follows.
          controller.apply(scene(12.5, 'clear'));
          await wait(300);
          // Layered decks from a forecast frame (not a scenario): the same minute after sunset with
          // only cirrus (stays sunlit, pink) and with only a low stratus deck (in shadow, dark).
          const frameAt = (hour, layers) => ({
            timestamp: localSelectionToUtc(
              { year: 2026, month: 5, day: 31 },
              hour * 60,
              kailua.timeZone,
            ).toISOString(),
            cloudCoverTotal: Math.max(layers.low, layers.mid, layers.high),
            cloudCoverLow: layers.low,
            cloudCoverMid: layers.mid,
            cloudCoverHigh: layers.high,
            precipitationProbability: 0,
            precipitationAmount: 0,
            humidity: 60,
            visibility: 40000,
            windSpeed: 3,
            windDirection: 90,
            weatherCode: 2,
          });
          const forecastScene = (hour, layers, camera) =>
            buildSceneState({
              location: kailua,
              utc: localSelectionToUtc(
                { year: 2026, month: 5, day: 31 },
                hour * 60,
                kailua.timeZone,
              ),
              now: new Date('2026-05-30T00:00:00Z'),
              camera,
              environment: env,
              scenario: 'clear',
              forceScenario: false,
              weather: {
                capabilities: OPEN_METEO_CAPABILITIES,
                frames: [frameAt(19, layers), frameAt(20, layers)],
                providerFailed: false,
              },
              render: DEFAULT_RENDER_SETTINGS,
              includeLunar: true,
              realReference: false,
            });
          const westCam = { ...defaultCamera(kailua.point, 265), mode: 'viewpoint', pitchDeg: 8 };
          const cirrus = forecastScene(19.3, { low: 0, mid: 0, high: 80 }, westCam);
          controller.apply(cirrus);
          window.__smoke.lighting.cirrus = lightingFromScene(cirrus);
          log(
            'applied cirrus sunset (forecast frame) ' +
              cirrus.atmosphere.mode +
              ' el=' +
              cirrus.solar.elevationDegrees.toFixed(2),
          );
          await wait(1500);
          window.__smoke.shot = 'cirrus-sunset';
          await new Promise((r) => {
            window.__takeShot = r;
          });
          // Cirrus in strands: 40 % high cloud alone with the Sun on the horizon, looking up
          // the sky to the west - filaments drawn out along the wind, lit warm, in some parts of
          // the veil and smooth in others (at 80 %, above, it is a sheet).
          controller.apply(
            forecastScene(
              19.05,
              { low: 0, mid: 0, high: 40 },
              { ...defaultCamera(kailua.point, 265), mode: 'viewpoint', pitchDeg: 28 },
            ),
          );
          await wait(1500);
          window.__smoke.shot = 'cirrus-strands';
          await new Promise((r) => {
            window.__takeShot = r;
          });
          // A halo: a cirrostratus sheet (85 % high cloud) with the Sun about 24 deg up, looking
          // at it - the 22 deg ring round it, the sun dogs either side at its height.
          {
            const hs = scene(17.4, 'clear');
            const haloCam = {
              ...defaultCamera(kailua.point, hs.solar.azimuthDegrees),
              mode: 'viewpoint',
              pitchDeg: hs.solar.elevationDegrees - 4,
            };
            controller.apply(forecastScene(17.4, { low: 0, mid: 0, high: 85 }, haloCam));
            await wait(1500);
            window.__smoke.shot = 'halo';
            await new Promise((r) => {
              window.__takeShot = r;
            });
          }
          const stratus = forecastScene(19.3, { low: 80, mid: 0, high: 0 }, westCam);
          controller.apply(stratus);
          window.__smoke.lighting.stratus = lightingFromScene(stratus);
          log('applied stratus sunset (forecast frame) ' + stratus.atmosphere.mode);
          await wait(1500);
          window.__smoke.shot = 'stratus-sunset';
          await new Promise((r) => {
            window.__takeShot = r;
          });
          // Shadow probe (accuracy before beauty): a 20 m tower on flat ground; its shadow must fall on
          // the anti-solar side with length h / tan(el), and must not fade at low Sun. Measured from
          // the frame itself: ground luminance along the shadow line vs the same distances on the Sun
          // side, and just beyond the shadow's end.
          const C = await import('@cesium/engine');
          const cesiumScene = host.scene;
          const towerLat = kailua.point.latitude + 0.0009;
          const towerLng = kailua.point.longitude;
          const enu = C.Transforms.eastNorthUpToFixedFrame(
            C.Cartesian3.fromDegrees(towerLng, towerLat, 0),
          );
          cesiumScene.primitives.add(
            new C.Primitive({
              geometryInstances: new C.GeometryInstance({
                geometry: C.BoxGeometry.fromDimensions({
                  dimensions: new C.Cartesian3(12, 12, 20),
                  vertexFormat: C.PerInstanceColorAppearance.VERTEX_FORMAT,
                }),
                modelMatrix: C.Matrix4.multiplyByTranslation(
                  enu,
                  new C.Cartesian3(0, 0, 10),
                  new C.Matrix4(),
                ),
                attributes: {
                  color: C.ColorGeometryInstanceAttribute.fromColor(
                    C.Color.fromCssColorString('#d0d0d0'),
                  ),
                },
              }),
              // Opaque, as the app's buildings are: the default (translucent) wrote no depth,
              // and the grade took the tower for sky - cloud drawn over it, the Sun through it.
              appearance: new C.PerInstanceColorAppearance({ closed: true, translucent: false }),
              shadows: C.ShadowMode.ENABLED,
              asynchronous: false,
            }),
          );
          const shadowScene = scene(18.25, 'clear');
          controller.apply(shadowScene);
          controller.setOrbit({ headingDeg: 0, pitchDeg: -89, rangeM: 420 });
          await wait(3000);
          // The switch from the viewpoint is a camera flight, and on software GL it can outlast the
          // wait: measure only once the camera stands over the tower (a capture mid-flight read
          // the sky over the Earth's limb, and the probe failed for no fault in the shadow).
          for (let i = 0; i < 60; i++) {
            const cam = cesiumScene.camera;
            if (!cam._currentFlight && Math.abs(cam.positionCartographic.height - 420) < 40) break;
            await wait(500);
          }
          const el = shadowScene.solar.elevationDegrees;
          const az = shadowScene.solar.azimuthDegrees;
          const shadowAz = (az + 180) % 360;
          const len = 20 / Math.tan((el * Math.PI) / 180);
          const probe = (bearingDeg, distM) => {
            const b = (bearingDeg * Math.PI) / 180;
            const world = C.Matrix4.multiplyByPoint(
              enu,
              new C.Cartesian3(Math.sin(b) * distM, Math.cos(b) * distM, 0.3),
              new C.Cartesian3(),
            );
            const w = C.SceneTransforms.worldToWindowCoordinates(cesiumScene, world);
            return w ? { x: w.x, y: w.y } : null;
          };
          const fr = [0.3, 0.5, 0.7];
          const pts = {
            inShadow: fr.map((f) => probe(shadowAz, 8 + len * f)),
            sunSide: fr.map((f) => probe(az, 8 + len * f)),
            beyond: [probe(shadowAz, len * 1.6 + 12)],
          };

            const origSetGrade = host.setGrade.bind(host);
            host.setGrade = (u) =>

          // colour's alpha): eight storeys of ribbon windows, and a curtain-walled tower behind.
          const blockOf = (eastM, northM, w, h, rgba) =>
            new Cesium.GeometryInstance({
              geometry: Cesium.BoxGeometry.fromDimensions({
                dimensions: new Cesium.Cartesian3(w, w, h),
                vertexFormat: Cesium.PerInstanceColorAppearance.VERTEX_FORMAT,

              modelMatrix: Cesium.Transforms.eastNorthUpToFixedFrame(
                Cesium.Cartesian3.fromDegrees(kLon + eastM * mLon, kLat + northM * mLat, h / 2),

              stackPartitions: 5,
              slicePartitions: 7,
              vertexFormat: Cesium.PerInstanceColorAppearance.VERTEX_FORMAT,
            }),
            modelMatrix: Cesium.Transforms.eastNorthUpToFixedFrame(
              Cesium.Cartesian3.fromDegrees(
                kailua.point.longitude + 0.0006,
                kailua.point.latitude - 0.0004,
                8,
              ),
            ),
            attributes: {
              color: Cesium.ColorGeometryInstanceAttribute.fromColor(
                new Cesium.Color(0.22, 0.33, 0.16, 0.99),
              ),
            },
          });
          // And a conifer's crown, the layer's own cone (7 slices), nearer and to the right.
          const coniferInstance = new Cesium.GeometryInstance({
            geometry: new Cesium.CylinderGeometry({
              length: 12,
              topRadius: 0,
              bottomRadius: 3,
              slices: 7,
              vertexFormat: Cesium.PerInstanceColorAppearance.VERTEX_FORMAT,
            }),
            modelMatrix: Cesium.Transforms.eastNorthUpToFixedFrame(
              Cesium.Cartesian3.fromDegrees(kLon + 50 * mLon, kLat - 70 * mLat, 7.5),
            ),
            attributes: {
              color: Cesium.ColorGeometryInstanceAttribute.fromColor(
                new Cesium.Color(0.15, 0.25, 0.13, 1),
              ),
            },
          });
          const instancePrims = [];
          const drawInstances = (share, skyLift = 1, lights = 0, snow = 0, wet = 0) => {
            for (const p of instancePrims.splice(0)) host.scene.primitives.remove(p);

              [
                [blockInstance, ribbonInstance, curtainInstance],
                litInstanceShader(1, 0, true, share, skyLift, lights, snow, wet),
              ],
              [
                [crownInstance, coniferInstance],
                treeFragmentShader(1, 0, 1, 0, 1, share, 1, snow, wet),
              ],
            ])
              instancePrims.push(
                host.scene.primitives.add(
                  new Cesium.Primitive({
                    geometryInstances: instance,
                    asynchronous: false,
                    appearance: new Cesium.PerInstanceColorAppearance({
                      flat: false,
                      translucent: false,
                      closed: true,
                      fragmentShaderSource: fs,
                    }),
                  }),
                ),
              );

            ['buildings-overcast', 'overcast', 15],
            ['buildings-dusk', 'clear', 19.75],
            ['buildings-night', 'clear', 22],
            // The towns' glow (a suburb's index, the strongest glow to the north-east, ahead):
            // a warm dome low over the horizon, stronger under an overcast lit from below.
            ['town-glow', 'clear', 22],
            ['town-glow-overcast', 'overcast', 22],
          ]) {

              ...defaultCamera(
                {
                  latitude: kailua.point.latitude - 0.0009,
                  longitude: kailua.point.longitude - 0.0006,
                },
                45,
              ),
              mode: 'viewpoint',
              pitchDeg: 2,
            });
            const scl = lightingFromScene(sc);
            drawInstances(scl.globeLight.lambert / 0.9, scl.globeLight.skyLift, scl.cityLights);
            // The street lamps along the made-up grid (lit only at the dusk shot).
            host.setStreetLamps(streetLampPositions(grid, 35, 6000, kLon, kLat));
            host.setTownGlow(
              name.startsWith('town-glow')
                ? { at: kailua.point, index: 1.5, city: false, bearingDeg: 45 }
                : null,
            );
            controller.apply(sc);
            await wait(1800);
            window.__smoke.shot = name;
            await new Promise((r) => {
              window.__takeShot = r;
            });
          }
          // The Sun in the glass. At 18:30 the eye is put where the curtain tower's west wall
          // mirrors the low Sun from 40 m up: panes round that place must blaze, and the same
          // wall 28 m lower, five degrees off the mirror's line, must not. Measured, since it
          // tests the mirror's geometry: which way the reflection goes.
          {
            const g0 = scene(18.5, 'clear');
            const gAz = (g0.solar.azimuthDegrees * Math.PI) / 180;
            const gEl = (g0.solar.elevationDegrees * Math.PI) / 180;
            // Toward the Sun: east, north, up.
            const toSun = [
              Math.sin(gAz) * Math.cos(gEl),
              Math.cos(gAz) * Math.cos(gEl),
              Math.sin(gEl),
            ];
            // The wall's middle is 47 m east and 174 m north of the pin and faces west, so the
            // beam mirrored from 40 m up it goes on west, south where the Sun is north, and down.
            const mirrorH = 40;
            const run = (mirrorH - 1.7) / toSun[2];
            const eyeEast = 47 + run * toSun[0];
            const eyeNorth = 174 - run * toSun[1];
            const heading = (Math.atan2(47 - eyeEast, 174 - eyeNorth) * 180) / Math.PI;
            const sc = scene(18.5, 'clear', {
              ...defaultCamera(
                { latitude: kLat + eyeNorth * mLat, longitude: kLon + eyeEast * mLon },
                (heading + 360) % 360,
              ),
              mode: 'viewpoint',
              pitchDeg: 6,
            });
            const scl = lightingFromScene(sc);
            drawInstances(scl.globeLight.lambert / 0.9, scl.globeLight.skyLift, scl.cityLights);
            host.setStreetLamps([]);
            host.setTownGlow(null);
            controller.apply(sc);
            await wait(2500);
            const onWall = (h) =>
              Cesium.SceneTransforms.worldToWindowCoordinates(
                host.scene,
                Cesium.Cartesian3.fromDegrees(kLon + 47 * mLon, kLat + 174 * mLat, h),
              );
            const spots = { mirror: onWall(mirrorH), below: onWall(mirrorH - 28) };
            // And the level ground in front must be even: with the globe casting shadows on
            // ground that has no normals (this stage's ellipsoid) it shadowed itself in a moire
            // of stripes under this low Sun. A patch of the foreground, left of the blocks.
            const groundPatch = { x: 0.1, y: 0.72, w: 0.3, h: 0.16 };
            const dataUrl = await host.captureThumbnail(4096);
            const bright = await new Promise((resolve) => {
              const img = new Image();
              img.onload = () => {
                const cv = document.createElement('canvas');
                cv.width = img.width;
                cv.height = img.height;
                const ctx = cv.getContext('2d');
                ctx.drawImage(img, 0, 0);
                const sx = img.width / host.scene.canvas.clientWidth;
                const sy = img.height / host.scene.canvas.clientHeight;
                // Pixels brighter than 0.8 in a 40 px square about a spot.
                const count = (p) => {
                  if (!p) return null;
                  const d = ctx.getImageData(
                    Math.round((p.x - 20) * sx),
                    Math.round((p.y - 20) * sy),
                    Math.round(40 * sx),
                    Math.round(40 * sy),
                  ).data;

                  return n;
                };

                  Math.round(groundPatch.y * img.height),
                  Math.round(groundPatch.w * img.width),
                  Math.round(groundPatch.h * img.height),

                let sq = 0;

                  sq += l * l;

                  mirror: count(spots.mirror),
                  below: count(spots.below),
                  groundSpread,

              eyeNorth,

        if (!window.__synthOnly || window.__townOnly) {

          const town = installSyntheticTown(kailua.point);

            { kind: 'ellipsoid', attribution: '' },
            { kind: 'cesium-natural-earth', attribution: 'NE' },
            { kind: 'vector-tiles', url: town.url, attribution: 'made up' },

          const tLat = 1 / 111320;

            latitude: kailua.point.latitude + north * tLat,
            longitude: kailua.point.longitude + east * tLon,

            const t0 = performance.now();
            while (performance.now() - t0 < capMs) {
              const layer = host.osmBuildings;
              if (layer) {

                  .loadAround(kailua.point.longitude, kailua.point.latitude)
                  .catch(() => undefined);

          const has = names.map((k, i) => host.hasBuildingAt(points[i]));
          names.forEach((k, i) => {

          });

          await new Promise((r) => {
            window.__takeShot = r;
          });

          // is no building. Where the renderer cannot sample heights there is nothing to compare.

            fail('sampleSurfaceHeights threw: ' + ((e && e.message) || e));
            return null;
          });

            names.forEach((k, i) => {

              const tol = TOWN_PROBES[k].tolM ?? 1.5;

              const says = (v) => (v === null ? 'nothing' : v.toFixed(1) + ' m');
              if (want === null ? got !== null : got === null || Math.abs(got - want) > tol)

            });

            settledMs: tookMs,
            tilesAsked: town.asked.length,
            tilesWithData: withData,
            buildingPrimitives: layer ? layer.primitiveCount : 0,
            drawn: layer ? layer.collection.length : 0,
            treePrimitives: layer ? layer.treePrimitives().length : 0,
            footprints: Object.fromEntries(names.map((k, i) => [k, has[i]])),
            roofs: roofs
              ? Object.fromEntries(
                  names.map((k, i) => [k, roofs[i] === null ? null : +roofs[i].toFixed(2)]),
                )
              : 'heights cannot be sampled here',
          };
          log('town: ' + JSON.stringify(window.__smoke.town));
          // The same street at the blue hour - the layer takes the town's lights from the scene
          // itself here - and the town from above.
          controller.apply(street(19.75, 'clear'));
          await wait(2500);
          window.__smoke.shot = 'town-street-dusk';
          await new Promise((r) => {
            window.__takeShot = r;
          });
          controller.apply(scene(15, 'clear', null));
          controller.setOrbit({ headingDeg: 20, pitchDeg: -28, rangeM: 520 });
          await wait(4000);
          window.__smoke.shot = 'town-above';
          await new Promise((r) => {
            window.__takeShot = r;
          });
          await controller.setProviders(
            { kind: 'ellipsoid', attribution: '' },
            { kind: 'cesium-natural-earth', attribution: 'NE' },
          );
          town.restore();
          // Nothing of the town may stay behind. The street map the host draws from the same
          // tiles once did: it called the ground round the pin "known, no water", and the
          // synthetic terrain's sea came up as a slab of sand at the next stage's first shot.
          if (host.roadCanvas || host.roadTemplate || host.roadBounds)
            fail('the street map outlived the tiles it was drawn from');

          controller.setOrbit({ headingDeg: 120, pitchDeg: -35, rangeM: 160 });
          await wait(1800);

        }
        // Synthetic terrain (synthetic-terrain.js): quantized-mesh tiles with vertex normals and
        // a water mask, so the globe itself applies the ground material and draws water - the
        // real globe program, not a probe. Sea to the west (the sunset's side in May), a beach
        // at the pin, a ridge 3.5 km east. A place a hair from the pin's, so the controller
        // samples the new ground and its sea level.
        const { createSyntheticTerrain } = await import('/synthetic-terrain.js');
        host.scene.terrainProvider = createSyntheticTerrain(Cesium, kailua.point);
        const beach = {
          ...kailua,
          point: { latitude: kailua.point.latitude + 1e-6, longitude: kailua.point.longitude },
        };
        const beachScene = (hour, scenario, camera) =>
          buildSceneState({
            location: beach,
            utc: localSelectionToUtc({ year: 2026, month: 5, day: 31 }, hour * 60, beach.timeZone),
            now: new Date('2026-05-01T00:00:00Z'),
            camera: camera ?? defaultCamera(beach.point, 90),
            environment: { ...env, terrainAvailable: true, terrainProviderId: 'synthetic' },
            scenario,
            forceScenario: true,
            weather: { capabilities: OPEN_METEO_CAPABILITIES, frames: [], providerFailed: false },
            render: DEFAULT_RENDER_SETTINGS,
            includeLunar: true,
            realReference: false,
          });
        // Settled: the camera has stopped (the map flies to the pin) and the globe says its
        // tiles are loaded, three checks running; SwiftShader is slow, so up to 45 s.
        const settle = async () => {
          const cam = host.scene.camera;
          let last = cam.positionWC.clone();
          let still = 0;
          // A wall-clock deadline: on SwiftShader one frame can take seconds.
          const deadline = performance.now() + 45_000;
          while (performance.now() < deadline && still < 3) {
            await wait(250);
            host.scene.requestRender();
            const moved = Cesium.Cartesian3.distance(last, cam.positionWC) > 0.5;
            last = cam.positionWC.clone();
            still = !moved && host.scene.globe.tilesLoaded ? still + 1 : 0;
          }
          return still >= 3;
        };
        const synthShot = async (name, hour, scenario, camera, orbit) => {
          controller.apply(beachScene(hour, scenario, camera));
          if (orbit) controller.setOrbit(orbit);
          await wait(1500);
          if (!(await settle())) log(name + ': not settled in 45 s');
          await wait(500);
          window.__smoke.shot = name;
          await new Promise((r) => {
            window.__takeShot = r;
          });
        };
        const overRidge = { headingDeg: 70, pitchDeg: -22, rangeM: 7000 };
        // Valley mist: dawn over the plain from above its western end, looking east toward the
        // ridge with the Sun just over it, from forecast frames in dry air and in calm,
        // saturated air - the plain under a white layer, the ridge standing out of it.
        for (const [name, humidity] of [
          ['synth-dawn-dry', 60],
          ['synth-dawn-mist', 98],
        ]) {
          const at = (hour) => ({
            timestamp: localSelectionToUtc(
              { year: 2026, month: 5, day: 31 },
              hour * 60,
              beach.timeZone,
            ).toISOString(),
            cloudCoverTotal: 0,
            cloudCoverLow: 0,

            precipitationProbability: 0,
            precipitationAmount: 0,
            humidity,
            visibility: 20000,
            windSpeed: 0.5,
            windDirection: 90,

          controller.apply(
            buildSceneState({
              location: beach,
              utc: localSelectionToUtc({ year: 2026, month: 5, day: 31 }, 6.2 * 60, beach.timeZone),
              now: new Date('2026-05-30T00:00:00Z'),
              camera: defaultCamera(beach.point, 90),
              environment: { ...env, terrainAvailable: true, terrainProviderId: 'synthetic' },
              scenario: 'clear',
              forceScenario: false,
              weather: {
                capabilities: OPEN_METEO_CAPABILITIES,

          controller.setOrbit({ headingDeg: 80, pitchDeg: -12, rangeM: 5000 });
          await wait(1500);
          if (!(await settle())) log(name + ': not settled in 45 s');
          await wait(500);
          window.__smoke.shot = name;
          await new Promise((r) => {
            window.__takeShot = r;

        }
        // Hoar frost: the plain just after sunrise after a clear, calm night at -2 deg C, looking
        // toward the low Sun from 300 m off - rime on the grass, glittering.
        {
          const at = (hour) => ({
            timestamp: localSelectionToUtc(
              { year: 2026, month: 5, day: 31 },
              hour * 60,
              beach.timeZone,
            ).toISOString(),
            cloudCoverTotal: 0,
            cloudCoverLow: 0,
            cloudCoverMid: 0,
            cloudCoverHigh: 0,
            precipitationProbability: 0,
            precipitationAmount: 0,
            humidity: 90,
            visibility: 30000,
            windSpeed: 1,
            windDirection: 60,
            weatherCode: 0,
            temperature: -2,
            dewPoint: -3.5,
          });
          controller.apply(
            buildSceneState({
              location: beach,
              utc: localSelectionToUtc({ year: 2026, month: 5, day: 31 }, 6.3 * 60, beach.timeZone),
              now: new Date('2026-05-31T15:00:00Z'),
              camera: defaultCamera(beach.point, 90),
              environment: { ...env, terrainAvailable: true, terrainProviderId: 'synthetic' },
              scenario: 'clear',
              forceScenario: false,
              weather: {
                capabilities: OPEN_METEO_CAPABILITIES,
                frames: [at(6), at(7)],
                providerFailed: false,
              },
              render: DEFAULT_RENDER_SETTINGS,
              includeLunar: true,
              realReference: false,
            }),
          );
          controller.setOrbit({ headingDeg: 75, pitchDeg: -10, rangeM: 300 });
          await wait(1500);
          if (!(await settle())) log('synth-frost: not settled in 45 s');
          await wait(500);
          window.__smoke.shot = 'synth-frost';
          await new Promise((r) => {
            window.__takeShot = r;
          });
        }
        // The hot spot: 10 am seen from above with the Sun behind the camera (Sun about 55 deg up
        // in the east, the view 55 deg down to the west), the antisolar point at the view's
        // centre on the shore - the grass brighter round it.
        {
          const at = (hour) => ({
            timestamp: localSelectionToUtc(
              { year: 2026, month: 5, day: 31 },
              hour * 60,
              beach.timeZone,
            ).toISOString(),
            cloudCoverTotal: 0,
            cloudCoverLow: 0,
            cloudCoverMid: 0,
            cloudCoverHigh: 0,
            precipitationProbability: 0,
            precipitationAmount: 0,
            humidity: 70,
            visibility: 30000,
            windSpeed: 1,
            windDirection: 60,
            weatherCode: 0,
            temperature: 16,
            dewPoint: 10,
          });
          controller.apply(
            buildSceneState({
              location: beach,
              utc: localSelectionToUtc({ year: 2026, month: 5, day: 31 }, 10 * 60, beach.timeZone),
              now: new Date('2026-05-31T15:00:00Z'),
              camera: defaultCamera(beach.point, 250),
              environment: { ...env, terrainAvailable: true, terrainProviderId: 'synthetic' },
              scenario: 'clear',
              forceScenario: false,
              weather: {
                capabilities: OPEN_METEO_CAPABILITIES,
                frames: [at(9.5), at(10.5)],
                providerFailed: false,
              },
              render: DEFAULT_RENDER_SETTINGS,
              includeLunar: true,
              realReference: false,
            }),
          );
          controller.setOrbit({ headingDeg: 265, pitchDeg: -55, rangeM: 600 });
          await wait(1500);
          if (!(await settle())) log('synth-hotspot: not settled in 45 s');
          await wait(500);
          window.__smoke.shot = 'synth-hotspot';
          await new Promise((r) => {
            window.__takeShot = r;
          });
        }
        // Whitecaps: the sea at noon in a 14 m/s trade wind (forecast frames), from 400 m off the
        // shore looking out to sea - foam flecking about 3 % of the water.
        {
          const at = (hour) => ({
            timestamp: localSelectionToUtc(
              { year: 2026, month: 5, day: 31 },
              hour * 60,
              beach.timeZone,
            ).toISOString(),
            cloudCoverTotal: 20,
            cloudCoverLow: 20,
            cloudCoverMid: 0,
            cloudCoverHigh: 0,
            precipitationProbability: 0,
            precipitationAmount: 0,
            humidity: 70,
            visibility: 30000,
            windSpeed: 14,
            windDirection: 60,
            weatherCode: 1,
          });
          controller.apply(
            buildSceneState({
              location: beach,
              utc: localSelectionToUtc({ year: 2026, month: 5, day: 31 }, 12 * 60, beach.timeZone),
              now: new Date('2026-05-31T20:00:00Z'),
              camera: defaultCamera(beach.point, 270),
              environment: { ...env, terrainAvailable: true, terrainProviderId: 'synthetic' },
              scenario: 'clear',
              forceScenario: false,
              weather: {
                capabilities: OPEN_METEO_CAPABILITIES,
                frames: [at(11.5), at(12.5)],
                providerFailed: false,
              },
              render: DEFAULT_RENDER_SETTINGS,
              includeLunar: true,
              realReference: false,
            }),
          );
          controller.setOrbit({ headingDeg: 260, pitchDeg: -25, rangeM: 400 });
          await wait(1500);
          if (!(await settle())) log('synth-whitecaps: not settled in 45 s');
          await wait(500);
          window.__smoke.shot = 'synth-whitecaps';
          await new Promise((r) => {
            window.__takeShot = r;
          });
          // Lake ice: the same water taken as a lake 100 m above the sea (the sea level set 100 m
          // down) in the snow season - frozen, snow-covered, swept grey-blue in patches.
          {
            const gu = host.scene.globe.material.uniforms;
            const was = [gu.u_lakeIce, gu.u_seaLevelM, gu.u_shore];
            gu.u_lakeIce = 1;
            gu.u_seaLevelM = -100;
            gu.u_shore = 0;
            await wait(2500);
            window.__smoke.shot = 'synth-lake-ice';
            await new Promise((r) => {
              window.__takeShot = r;
            });
            [gu.u_lakeIce, gu.u_seaLevelM, gu.u_shore] = was;
          }
          // Shallows: the same sea with its level taken as measured (the synthetic run never
          // measures it) - the water over the shelving floor pale turquoise near the beach,
          // deepening to blue by 12 m.
          {
            const gu = host.scene.globe.material.uniforms;
            const was = [gu.u_seaLevelM, gu.u_shore];
            gu.u_seaLevelM = 0;
            gu.u_shore = 1;
            await wait(2500);
            window.__smoke.shot = 'synth-shallows';
            await new Promise((r) => {
              window.__takeShot = r;
            });
            [gu.u_seaLevelM, gu.u_shore] = was;
          }
        }
        // After the rain: the plain at 7 am, looking east toward the low Sun from 300 m off, the
        // forecast's 3 mm of rain two hours gone and the sky clear now, against the same hour dry:
        // the ground still wet, puddles mirroring the sky and the Sun's glint.
        for (const [name, rainMm] of [
          ['synth-after-dry', 0],
          ['synth-after-rain', 3],
        ]) {
          const at = (hour, mm) => ({
            timestamp: localSelectionToUtc(
              { year: 2026, month: 5, day: 31 },
              hour * 60,
              beach.timeZone,
            ).toISOString(),
            cloudCoverTotal: 5,
            cloudCoverLow: 5,
            cloudCoverMid: 0,
            cloudCoverHigh: 0,
            precipitationProbability: 0,
            precipitationAmount: mm,
            humidity: 75,
            visibility: 30000,
            windSpeed: 3,
            windDirection: 60,
            weatherCode: 1,
          });
          controller.apply(
            buildSceneState({
              location: beach,
              utc: localSelectionToUtc({ year: 2026, month: 5, day: 31 }, 7 * 60, beach.timeZone),
              now: new Date('2026-05-31T15:00:00Z'),
              camera: defaultCamera(beach.point, 90),
              environment: { ...env, terrainAvailable: true, terrainProviderId: 'synthetic' },
              scenario: 'clear',
              forceScenario: false,
              weather: {
                capabilities: OPEN_METEO_CAPABILITIES,
                frames: [at(5, rainMm), at(6, 0), at(7, 0), at(8, 0)],
                providerFailed: false,
              },
              render: DEFAULT_RENDER_SETTINGS,
              includeLunar: true,
              realReference: false,
            }),
          );
          controller.setOrbit({ headingDeg: 75, pitchDeg: -5, rangeM: 120 });
          await wait(1500);
          if (!(await settle())) log(name + ': not settled in 45 s');
          await wait(500);
          window.__smoke.shot = name;
          await new Promise((r) => {
            window.__takeShot = r;
          });
        }
        await synthShot('synth-map-clear', 10, 'clear', null, overRidge);
        await synthShot('synth-map-overcast', 10, 'overcast', null, overRidge);
        // Broken cloud from above: the shadows the sky's decks cast, kilometres across.
        await synthShot('synth-map-partly', 10, 'partly-cloudy', null, overRidge);
        // The map at night under the full Moon is a chart, flat and dimmed - not lit by the
        // moonlight. It once was: a globe that casts shadows is lit by Cesium's shadow shader
        // whatever its own lighting says, so on the nights the Moon was bright enough to cast
        // them the map went all but black. Measured: the land must keep the chart's brightness.
        {
          await synthShot('synth-map-moon', 23, 'clear', null, overRidge);
          const dataUrl = await host.captureThumbnail(4096);
          const mean = await new Promise((resolve) => {
            const img = new Image();
            img.onload = () => {
              const cv = document.createElement('canvas');
              cv.width = img.width;
              cv.height = img.height;
              const ctx = cv.getContext('2d');
              ctx.drawImage(img, 0, 0);
              const d = ctx.getImageData(0, 0, img.width, img.height).data;
              let sum = 0;
              for (let i = 0; i < d.length; i += 4)
                sum += (0.2126 * d[i] + 0.7152 * d[i + 1] + 0.0722 * d[i + 2]) / 255;
              resolve(sum / (d.length / 4));
            };
            img.src = dataUrl;
          });
          window.__smoke.moonMap = { mean, globeShadows: host.scene.globe.shadows };
          log('moon map: ' + JSON.stringify(window.__smoke.moonMap));
          if (!(mean > 0.05))
            window.__smoke.errors.push(
              `moon map: the night map's mean brightness is ${mean.toFixed(3)} (a dimmed chart is over 0.05; lit by moonlight it is near black)`,
            );
        }
        const look = (headingDeg, pitchDeg) => ({
          ...defaultCamera(beach.point, headingDeg),
          mode: 'viewpoint',
          pitchDeg,
        });
        await synthShot('synth-golden-sea', 18.75, 'clear', look(290, 0));
        await synthShot('synth-golden-ridge', 18.75, 'clear', look(80, 4));
        // Dew: 7 am (the Sun just clear of the ridge) at 16 deg C and 98 % humidity, from the beach looking along the grass
        // toward the low Sun - the grass beaded, a silvery sheen and points of light toward the Sun.
        {
          const at = (hour) => ({
            timestamp: localSelectionToUtc(
              { year: 2026, month: 5, day: 31 },
              hour * 60,
              beach.timeZone,
            ).toISOString(),
            cloudCoverTotal: 0,
            cloudCoverLow: 0,
            cloudCoverMid: 0,
            cloudCoverHigh: 0,
            precipitationProbability: 0,
            precipitationAmount: 0,
            humidity: 98,
            visibility: 30000,
            windSpeed: 1,
            windDirection: 60,
            weatherCode: 0,
            temperature: 16,
            dewPoint: 15.7,
          });
          controller.apply(
            buildSceneState({
              location: beach,
              utc: localSelectionToUtc({ year: 2026, month: 5, day: 31 }, 7 * 60, beach.timeZone),
              now: new Date('2026-05-31T15:00:00Z'),
              camera: { ...defaultCamera(beach.point, 75), mode: 'viewpoint', pitchDeg: -6 },
              environment: { ...env, terrainAvailable: true, terrainProviderId: 'synthetic' },
              scenario: 'clear',
              forceScenario: false,
              weather: {
                capabilities: OPEN_METEO_CAPABILITIES,
                frames: [at(6.5), at(7.5)],
                providerFailed: false,
              },
              render: DEFAULT_RENDER_SETTINGS,
              includeLunar: true,
              realReference: false,
            }),
          );
          await wait(1500);
          if (!(await settle())) log('synth-dew: not settled in 45 s');
          await wait(500);
          window.__smoke.shot = 'synth-dew';
          await new Promise((r) => {
            window.__takeShot = r;
          });
        }
        // (After the two views above from the same spot, so its tiles are in hand: as the first
        // view from the ground after the orbits it was still loading at any wait this run can
        // afford, its ridge half a coarse tile's slab.)
        await synthShot('synth-dusk-ridge', 19.4, 'clear', look(80, 4));
        // Alpenglow: the Sun 0.6 deg down at the pin - its own beam all but gone - and still up
        // for the ridge, whose top looks 0.9 deg past the pin's horizon: the plain in the
        // twilight's shade, the ridge's western face lit red toward its crest.
        await synthShot('synth-alpenglow', 19.135, 'clear', look(80, 4));
        await synthShot('synth-overcast-ridge', 12.5, 'overcast', look(80, 4));
        // Ground in cloud: a forecast with the air 3 deg C off its dew point - a cloud base
        // 380 m over the plain, half-way up the ridge - under a closed low deck (the ridge runs
        // up into the grey and its crest is gone) and under a broken one (the crest shows
        // through the gaps, the clouds beside it carrying on across its face).
        for (const [name, cover] of [
          ['synth-ridge-in-cloud', 100],
          ['synth-ridge-in-gaps', 45],
        ]) {
          const at = (hour) => ({
            timestamp: localSelectionToUtc(
              { year: 2026, month: 5, day: 31 },
              hour * 60,
              beach.timeZone,
            ).toISOString(),
            cloudCoverTotal: cover,
            cloudCoverLow: cover,
            cloudCoverMid: 0,
            cloudCoverHigh: 0,
            precipitationProbability: 0,
            precipitationAmount: 0,
            temperature: 20,
            dewPoint: 17,
            humidity: 83,
            visibility: 20000,
            windSpeed: 3,
            windDirection: 90,
            weatherCode: 3,
          });
          controller.apply(
            buildSceneState({
              location: beach,
              utc: localSelectionToUtc(
                { year: 2026, month: 5, day: 31 },
                12.5 * 60,
                beach.timeZone,
              ),
              now: new Date('2026-05-30T00:00:00Z'),
              camera: look(80, 4),
              environment: { ...env, terrainAvailable: true, terrainProviderId: 'synthetic' },
              scenario: 'clear',
              forceScenario: false,
              weather: {
                capabilities: OPEN_METEO_CAPABILITIES,
                frames: [at(12), at(13)],
                providerFailed: false,
              },
              render: DEFAULT_RENDER_SETTINGS,
              includeLunar: true,
              realReference: false,
            }),
          );
          await wait(1500);
          if (!(await settle())) log(name + ': not settled in 45 s');
          await wait(500);
          window.__smoke.shot = name;
          await new Promise((r) => {
            window.__takeShot = r;
          });
        }
        // Tile edges under a grazing Sun: from above the low hills on the plain (800 m east and
        // 660 m north of the pin) half an hour after sunrise, the light skimming their slopes.
        // The terrain's tiles are drawn with their skirts, so no sky shows between them; and the
        // skirts are kept out of the shadow map (skirt-shadows.ts), so no dark line runs along a
        // tile's edge (with skirts casting, three ran across this view).
        {
          const hillPoint = {
            latitude: beach.point.latitude + 660 / 111_320,
            longitude:
              kailua.point.longitude +
              800 / (111_320 * Math.cos((kailua.point.latitude * Math.PI) / 180)),
          };
          const hill = { ...beach, point: hillPoint };
          controller.apply(
            buildSceneState({
              location: hill,
              utc: localSelectionToUtc({ year: 2026, month: 5, day: 31 }, 6.2 * 60, hill.timeZone),
              now: new Date('2026-05-01T00:00:00Z'),
              camera: defaultCamera(hillPoint, 90),
              environment: { ...env, terrainAvailable: true, terrainProviderId: 'synthetic' },
              scenario: 'clear',
              forceScenario: true,
              weather: { capabilities: OPEN_METEO_CAPABILITIES, frames: [], providerFailed: false },
              render: DEFAULT_RENDER_SETTINGS,
              includeLunar: true,
              realReference: false,
            }),
          );
          controller.setOrbit({ headingDeg: 270, pitchDeg: -40, rangeM: 700 });
          await wait(1500);
          if (!(await settle())) log('synth-tile-edges: not settled in 45 s');
          await wait(500);
          window.__smoke.shot = 'synth-tile-edges';
          await new Promise((r) => {
            window.__takeShot = r;
          });
        }
        // From the ridge's summit (~817 m) looking west down over the plain and out to sea: the
        // haze thins with height above the place (u_hazeBaseM, the summit's ground), so the
        // plain and the sea below sink into it while the sky over the far horizon stays clear.
        const { syntheticHeight } = await import('/synthetic-terrain.js');
        const summitPoint = {
          latitude: beach.point.latitude,
          longitude:
            kailua.point.longitude +
            3500 / (111_320 * Math.cos((kailua.point.latitude * Math.PI) / 180)),
          elevationM: syntheticHeight(3500, 0),
        };
        const summit = { ...beach, point: summitPoint };
        for (const [name, scenario] of [
          ['synth-summit-clear', 'clear'],
          ['synth-summit-partly', 'partly-cloudy'],
        ]) {
          controller.apply(
            buildSceneState({
              location: summit,
              utc: localSelectionToUtc({ year: 2026, month: 5, day: 31 }, 16 * 60, summit.timeZone),
              now: new Date('2026-05-01T00:00:00Z'),
              camera: { ...defaultCamera(summitPoint, 270), mode: 'viewpoint', pitchDeg: -6 },
              environment: { ...env, terrainAvailable: true, terrainProviderId: 'synthetic' },
              scenario,
              forceScenario: true,
              weather: { capabilities: OPEN_METEO_CAPABILITIES, frames: [], providerFailed: false },
              render: DEFAULT_RENDER_SETTINGS,
              includeLunar: true,
              realReference: false,
            }),
          );
          await wait(1500);
          if (!(await settle())) log(name + ': not settled in 45 s');
          await wait(500);
          window.__smoke.shot = name;
          await new Promise((r) => {
            window.__takeShot = r;
          });
        }
        // Snow sparkle: the summit again with the snowline brought down to 200 m (the uniform
        // set after the scene is applied), looking down toward the afternoon Sun (the forward
        // sheen and the grains' flashes near the eye) and away from it (flashes, no sheen).
        for (const [name, heading] of [
          ['synth-snow-sun', 280],
          ['synth-snow-away', 100],
        ]) {
          controller.apply(
            buildSceneState({
              location: summit,
              utc: localSelectionToUtc(
                { year: 2026, month: 5, day: 31 },
                16.5 * 60,
                summit.timeZone,
              ),
              now: new Date('2026-05-01T00:00:00Z'),
              camera: { ...defaultCamera(summitPoint, heading), mode: 'viewpoint', pitchDeg: -28 },
              environment: { ...env, terrainAvailable: true, terrainProviderId: 'synthetic' },
              scenario: 'clear',
              forceScenario: true,
              weather: { capabilities: OPEN_METEO_CAPABILITIES, frames: [], providerFailed: false },
              render: DEFAULT_RENDER_SETTINGS,
              includeLunar: true,
              realReference: false,
            }),
          );
          host.scene.globe.material.uniforms.u_snowlineM = 200;
          await wait(1500);
          if (!(await settle())) log(name + ': not settled in 45 s');
          await wait(500);
          window.__smoke.shot = name;
          await new Promise((r) => {
            window.__takeShot = r;
          });
        }
        // Backlit grass: from the summit at 18:36, looking down the slopes into the low Sun - the
        // fields glow where the light comes through the blades (the snowline put back up).
        {
          const bl = buildSceneState({
            location: summit,
            utc: localSelectionToUtc({ year: 2026, month: 5, day: 31 }, 18.6 * 60, summit.timeZone),
            now: new Date('2026-05-01T00:00:00Z'),
            camera: { ...defaultCamera(summitPoint, 0), mode: 'viewpoint', pitchDeg: -10 },
            environment: { ...env, terrainAvailable: true, terrainProviderId: 'synthetic' },
            scenario: 'clear',
            forceScenario: true,
            weather: { capabilities: OPEN_METEO_CAPABILITIES, frames: [], providerFailed: false },
            render: DEFAULT_RENDER_SETTINGS,
            includeLunar: true,
            realReference: false,
          });
          controller.apply({
            ...bl,
            camera: { ...bl.camera, headingDeg: bl.solar.azimuthDegrees },
          });
          host.scene.globe.material.uniforms.u_snowlineM = 6000;
          await wait(1500);
          if (!(await settle())) log('synth-backlit: not settled in 45 s');
          await wait(500);
          window.__smoke.shot = 'synth-backlit';
          await new Promise((r) => {
            window.__takeShot = r;
          });
        }
        // SMOKE_DEBUG=water: the map view once more with a material that paints what the globe
        // hands the material - red the water mask, green the height in 10 m bands, blue the
        // slope - to see where the coast's water ends.
        if (window.__synthDebug) {
          const real = host.scene.globe.material;
          host.scene.globe.material = new Cesium.Material({
            fabric: {
              type: 'LightMapDebugWater',
              source:
                'czm_material czm_getMaterial(czm_materialInput m) {\n' +
                '  czm_material mat = czm_getDefaultMaterial(m);\n' +
                '  mat.diffuse = vec3(m.waterMask, fract(m.height / 10.0), clamp(m.slope * 10.0, 0.0, 1.0));\n' +
                '  mat.alpha = 1.0;\n' +
                '  return mat;\n' +
                '}\n',
            },
          });
          await synthShot('synth-debug-water', 10, 'clear', null, overRidge);
          host.scene.globe.material = real;
        }
        window.__smoke.synthetic = {
          terrainHasNormals: host.terrainHasNormals(),
          groundMaterial: !!host.scene.globe.material,
        };
        log('synthetic terrain drawn: ' + JSON.stringify(window.__smoke.synthetic));
        const thumb = await host.captureThumbnail(320);
        window.__smoke.thumbnail = thumb
          ? thumb.slice(0, 40) + '… (' + thumb.length + ' chars)'
          : null;
        // pick: click centre of the canvas via the host's own handler
        let picked = null;
        host.onPick((p) => {
          picked = p;
        });
        window.__smoke.pickerInstalled = true;
        window.__smoke.stats = host.stats();
        log('done');
      } catch (e) {
        window.__smoke.errors.push('fatal: ' + ((e && e.stack) || e));
      }
      window.__smoke.done = true;
    </script>
